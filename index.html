<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACCUMULATION — 2026 계명대학교 시각디자인 졸업전시</title>
  <meta name="description" content="축적. 2026 계명대학교 시각디자인학과 졸업전시. 12월 11–16일, 대구경북디자인진흥원 4F.">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png?v=3">
  <style>
    /* =========================================================
       A2 포스터 디자인 시스템 -> 웹 반응형 변환
       Dropbox Brand Style (Brutalism 1px Grid & Pop Colors)
       ========================================================= */
    :root {
      --red: #FF5349;
      --ink: #000000;      /* 드롭박스 스타일 완전한 검은색 */
      --paper: #F7F5F2;    /* 웜 톤 오프화이트 */
      --white: #FFFFFF;
      --db-blue: #0061FE;  /* 드롭박스 포인트 블루 */

      /* 규격 변환 변수 */
      --type-unit: 1.8px;
      --basic-margin: clamp(16px, 0.79vw, 32px);   /* 베이식 여백 3.32mm -> 0.79vw */
      --quote-gap: clamp(4px, 0.42vw, 12px);       /* 따옴표 간격 1.764mm -> 0.42vw */
      --title-en-size: clamp(32px, 5.96vw, 100px); /* 영어 타이틀 71pt -> 5.96vw */

      --tracking-en: -0.08em;
      --tracking-ko: -0.1em;
    }

    @font-face {
      font-family: 'SohneBreitBuch';
      src: url("assets/fonts/SohneBreit-Buch.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'SM3태고딕';
      src: local('SM3태고딕'), local('SM3 태고딕'), local('SM3SPgoT');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Doltop";
      src: url("assets/fonts/Doltop.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      overscroll-behavior-y: none;
    }

    body {
      min-height: 100%;
      margin: 0;
      opacity: 0;
      transition: transform .6s cubic-bezier(.22, 1, .36, 1), opacity .6s, visibility .6s;
      font-family: 'SohneBreitBuch', 'SM3태고딕', sans-serif;
      background: var(--paper);
      color: var(--ink);
      letter-spacing: var(--tracking-ko);
      line-height: 1;
      opacity: 1;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 영문 타이틀 스타일 시스템 적용 */
    .title-en {
      font-family: 'SohneBreitBuch', 'SM3태고딕', sans-serif;
      letter-spacing: var(--tracking-en);
    }

    .font-sohne {
      font-family: 'SohneBreitBuch', 'SM3태고딕', sans-serif;
      letter-spacing: normal;
    }

    .hero-title, .portal-title {
      font-size: var(--title-en-size) !important;
      line-height: 0.82;
    }

    button, input, a {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
    }

    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--db-blue);
      outline-offset: 2px;
    }

    ::selection {
      background: var(--db-blue);
      color: var(--white);
    }

    a {
      text-decoration: none;
    }

    /* =========================================================
       MAIN STAGE (100vw, 100vh 꽉 채운 1px 그리드 구조)
       ========================================================= */
    .journey {
      height: 460vh;
    }
    
    .stage {
      height: 100svh;
      position: sticky;
      top: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink); /* 그리드 라인 색상 역할 */
    }

    .entry {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      transition: opacity .3s;
      pointer-events: none;
      padding: 0 var(--basic-margin);
      z-index: 1;
    }
    
    .entry h1 {
      font-weight: 400;
      margin: 0;
      word-break: keep-all;
      color: var(--white);
    }

    .logo-stack {
      width: 100vw;
      height: min(100svh, calc(100vw * 799 / 3558));
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: min(var(--type-unit), .15vw);
      padding: 0;
    }

    .glyph {
      font-family: "Doltop", sans-serif;
      font-synthesis: none;
      position: relative;
      background: transparent;
      color: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(25.3vw, 113.5svh);
      font-weight: 400;
      line-height: .72;
      letter-spacing: -.1em;
      padding: 0;
      transform-origin: center;
      will-change: transform, opacity;
      overflow: hidden;
      isolation: isolate;
      border-radius: 0;
    }

    .glyph-letter {
      position: relative;
      display: block;
      font: inherit;
      letter-spacing: inherit;
      line-height: inherit;
      pointer-events: none;
      position: relative;
      z-index: 2;
      transform-origin: center;
      transform: none;
      transition: transform .52s cubic-bezier(.22, 1, .36, 1), color .24s;
    }

    .glyph-letter { display: block; width: 100%; height: 100%; flex-shrink: 0; }
    .glyph.is-active, .glyph:focus-visible { z-index: 10; overflow: visible; }
    .glyph-letter svg { display: block; width: 100%; height: 100%; overflow: visible; fill: currentColor; }

    .glyph-caption {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 3px;
      color: var(--red);
      font-family: 'SohneBreitBuch', 'SM3태고딕', sans-serif;
      font-size: clamp(18px, calc(1vw + 2px), 22px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.1;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      overflow-wrap: anywhere;
      word-break: keep-all;
      transition: opacity .2s, transform .38s cubic-bezier(.2, .8, .2, 1);
    }

    .glyph-caption-en { font-size: clamp(8px, 1.4vw, 22px); line-height: 1.1; letter-spacing: 0; }
    .glyph-caption-ko { font-size: clamp(9px, 1vw, 16px); line-height: 1.35; letter-spacing: 0; word-break: normal; }
    @media (max-width: 640px) { .glyph-caption { gap: 3px; } }
    @media (max-width: 700px) {
      .glyph-caption-en, .glyph-caption-ko { white-space: nowrap; }
      .glyph-caption-en { font-size: clamp(6px, 1.6vw, 10px); }
      .glyph-caption-ko { font-size: clamp(6px, 1.65vw, 10px); }
    }

    .glyph.is-active .glyph-letter,
    .glyph:focus-visible .glyph-letter {
      color: var(--red);
      transform: translateY(-100%);
    }

    .glyph.is-lifted { z-index: 9; overflow: visible; }
    .glyph.is-lifted .glyph-letter { transform: translateY(-100%); }

    .glyph.is-active .glyph-caption,
    .glyph:focus-visible .glyph-caption {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       PORTAL (모달 및 상세 페이지 구조)
       ========================================================= */
    .portal {
      --paper: var(--red);
      --white: var(--red);
      --db-blue: var(--ink);
      --rail-width: 18px;
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: auto;
      background: var(--red);
      color: var(--ink);
      visibility: hidden;
      transform: translateY(105%);
      opacity: 0;
      transition: transform .6s cubic-bezier(.22, 1, .36, 1), opacity .6s, visibility .6s;
    }

    .portal::before, .portal::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 6;
      width: var(--rail-width);
      display: grid;
      place-items: center;
      padding: 10px 3px;
      border-color: var(--ink);
      border-style: solid;
      background: var(--red);
      font-size: 8px;
      line-height: 1;
      letter-spacing: .04em;
      text-align: center;
      writing-mode: vertical-rl;
      pointer-events: none;
    }

    .portal::before {
      content: "KMU · VISUAL DESIGN · 2026";
      left: 0;
      border-width: 0 1px 0 0;
    }

    .portal::after {
      content: "ACCUMULATION · 12.11 — 12.16";
      right: 0;
      border-width: 0 0 0 1px;
    }

    .portal.open {
      visibility: visible;
      transform: translateY(0);
      opacity: 1;
    }

    .portal.student-page { --paper: #FF4349; --white: #FF4349; background: var(--paper); }
    .portal.student-page::before, .portal.student-page::after { display: none; }
    .portal.color-open { --paper: #F0EEE9; --white: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; background: #FF5349; transition: transform .6s cubic-bezier(.22, 1, .36, 1), opacity .6s, visibility .6s; }
    .portal.color-open::before, .portal.color-open::after { background: transparent; color: var(--color-rail-ink, var(--ink)); transition: color .85s cubic-bezier(.16, 1, .3, 1); }
    .portal.color-open .portal-header { position: relative; top: auto; z-index: 4; flex: 0 0 auto; background: transparent; }
    .portal.color-open .portal-header { color: var(--color-rail-ink, var(--ink)); border-color: var(--color-rail-ink, var(--ink)); transition: color .85s cubic-bezier(.16, 1, .3, 1), border-color .85s cubic-bezier(.16, 1, .3, 1); }
    .portal.color-open .portal-header button { border-color: var(--color-rail-ink, var(--ink)); transition: color .85s cubic-bezier(.16, 1, .3, 1), background-color .85s cubic-bezier(.16, 1, .3, 1), border-color .85s cubic-bezier(.16, 1, .3, 1); }
    .portal.color-open .portal-header .chapter-arrow { background: transparent; color: var(--color-rail-ink, var(--ink)); }
    .portal.color-open .portal-header .chapter-index-toggle,
    .portal.color-open .portal-header .close { background: var(--color-rail-ink, var(--ink)); color: var(--color-rail-background, var(--red)); }
    .portal.color-open .portal-content { position: relative; z-index: 1; box-sizing: border-box; display: flex; flex: 1 1 auto; width: 100%; height: 0; min-height: 0; max-width: none; margin: 0; overflow: hidden; padding: clamp(8px, 1.2vw, 18px) calc(var(--rail-width) + var(--basic-margin)); }
    .portal.logo-open { display: flex; flex-direction: column; overflow: hidden; }
    .portal.logo-open .portal-header { position: relative; top: auto; flex: 0 0 auto; }
    .portal.logo-open .portal-content { box-sizing: border-box; display: flex; flex: 1 1 auto; flex-direction: column; gap: clamp(6px, 1.2vh, 12px); height: 0; min-height: 0; overflow: hidden; padding: clamp(8px, 1.6vh, 16px) calc(var(--rail-width) + var(--basic-margin)); }
    .portal.logo-open .portal-content > .layer { opacity: 1; transform: none; transition: none; will-change: auto; }
    .portal.logo-open .subline { flex: 0 0 auto; padding: 8px 0; font-size: 12px; }
    .portal.logo-open .logo-lab { flex: 1 1 auto; width: 100%; height: auto; min-height: 0; }
    .portal.logo-open .lab-layout { width: min(100%, 1600px); }
    .portal.logo-open .controls { flex: 0 0 auto; justify-content: center; margin: 0; }

    .portal.catalogue-open { display: flex; flex-direction: column; overflow: hidden; }
    .portal.catalogue-open .portal-header { position: relative; top: auto; flex: 0 0 auto; }
    .portal.catalogue-open .portal-content { box-sizing: border-box; display: flex; flex: 1 1 auto; height: 0; min-height: 0; overflow: hidden; padding: 4px calc(var(--rail-width) + 2px) 6px; }
    .portal.quiz-open { display: flex; flex-direction: column; overflow: hidden; }
    .portal.quiz-open .portal-header { position: relative; top: auto; flex: 0 0 auto; }
    .portal.quiz-open .portal-content { box-sizing: border-box; display: flex; flex: 1 1 auto; align-items: stretch; justify-content: flex-start; height: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 8px calc(var(--rail-width) + var(--basic-margin)); }
    .portal.quiz-open .portal-content > .layer { flex: 1 1 auto; min-width: 0; min-height: 0; opacity: 1; transform: none; transition: none; will-change: auto; }
    .portal.committee-open { --committee-space-sm: 16px; --committee-space-md: 24px; --committee-space-lg: 32px; display: block; overflow: auto; }
    .portal.committee-open::before, .portal.committee-open::after { position: absolute; }
    .portal.committee-open .portal-header { position: sticky; top: 0; border-bottom: 1px solid var(--ink); }
    .portal.committee-open .portal-content { display: block; height: auto; min-height: calc(100svh - 56px); overflow: visible; padding: var(--committee-space-sm) calc(var(--rail-width) + var(--basic-margin)) 40px; }
    .portal.collaboration-open { display: block; overflow: auto; }
    .portal.collaboration-open::before, .portal.collaboration-open::after { position: absolute; }
    .portal.collaboration-open .portal-header { position: sticky; top: 0; border-bottom: 1px solid var(--ink); }
    .portal.collaboration-open .portal-content { display: block; height: auto; min-height: calc(100svh - 56px); overflow: visible; padding: 16px calc(var(--rail-width) + var(--basic-margin)) 40px; }

    .portal-header {
      position: sticky;
      top: 0;
      padding: 12px calc(var(--rail-width) + var(--basic-margin));
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ink);
      background: inherit;
      z-index: 4;
    }

    .portal-header strong {
      display: flex;
      align-items: baseline;
      gap: .45em;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 400;
      text-transform: uppercase;
    }

    .close {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--red);
      padding: 10px 18px;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
    }
    .close:hover {
      background: var(--red);
      color: var(--ink);
    }

    .portal-content { 
      padding: clamp(28px, 5vw, 64px) calc(var(--rail-width) + var(--basic-margin)) 60px;
      min-height: calc(100svh - 82px); 
    }

    .portal-title {
      max-width: 100%;
      margin: 0 0 clamp(18px, 3vw, 36px);
      font-family: 'SohneBreitBuch', 'SM3태고딕', sans-serif;
      font-size: clamp(44px, 8vw, 122px) !important;
      line-height: .82;
      letter-spacing: -.08em;
      overflow-wrap: anywhere;
    }

    .subline {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 13px;
      line-height: 1.1;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 14px 0;
    }

    .quote-spacing {
      display: inline-flex;
      max-width: 100%;
      gap: var(--quote-gap);
    }

    .quote-text { min-width: 0; overflow-wrap: anywhere; }

    .control {
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 12px 18px;
      font-size: 14px;
      color: var(--red);
      transition: background 0.2s, color 0.2s;
    }
    .control:hover:not(:disabled) { background: var(--red); color: var(--ink); }
    .control:disabled { opacity: .4; cursor: default; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 24px; }

    /* 레이어 모션 */
    .portal-content { perspective: 1200px; }
    .portal-content > .layer {
      opacity: 0;
      transform: translate3d(0, -140px, 0) rotateX(-7deg) scale(.985);
      transform-origin: center top;
      backface-visibility: hidden;
      transition: opacity .42s ease-out, transform .88s cubic-bezier(.18, 1.12, .28, 1);
      will-change: opacity, transform;
    }
    .portal-content > .layer.arrived { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0) scale(1); }
    .portal-content { overflow: hidden; }
    
    /* ----------------------------------------------------
       각 포털 섹션별 세부 스타일 모음 (1px Grid Brutalism 적용)
       ---------------------------------------------------- */
    .stack-panel { margin: 35px 0; background: var(--ink); color: var(--paper); padding: 25px; min-height: 330px; display: flex; flex-direction: column; justify-content: flex-end; }
    .stack-rows { display: flex; flex-direction: column-reverse; gap: 1px; }
    .stack-row { border: 1px solid var(--ink); padding: 22px; font-size: clamp(20px, 3vw, 44px); letter-spacing: -.045em; animation: rise-in .6s cubic-bezier(.2, .8, .2, 1) both; }
    .stack-row:nth-child(2n) { background: var(--db-blue); color: var(--white); margin-left: 8%; }
    .stack-row:nth-child(3n) { margin-left: 16%; background: var(--paper); color: var(--ink); }
    @keyframes rise-in { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
    
    .regular-copy { font-size: 17px; line-height: 1.2; max-width: 650px; }

    .work-list { border-top: 1px solid var(--ink); }
    .work-item { display: grid; grid-template-columns: 56px minmax(0, 1fr) max-content; align-items: center; gap: 16px; width: 100%; padding: 22px 0; border-bottom: 1px solid var(--ink); text-align: left; }
    .work-item strong { font-size: clamp(28px, 5vw, 76px); font-weight: 400; line-height: .9; }
    .work-item:nth-child(2n) { padding-inline: 16px; background: var(--ink); color: var(--red); }
    .work-detail { display: none; margin-top: 20px; padding: clamp(22px, 4vw, 48px); background: var(--ink); color: var(--red); }
    .work-detail.show { display: block; }
    .work-detail h3 { margin: 16px 0; font-size: clamp(42px, 8vw, 112px); font-weight: 400; line-height: .85; }
    .work-detail p { max-width: 680px; line-height: 1.25; }
    
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--ink); border: 1px solid var(--ink); margin: 30px 0; }
    .role-card { padding: 25px; background: var(--paper); color: var(--ink); min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; transition: background 0.2s, color 0.2s; }
    .role-card strong { font-size: 28px; font-weight: 400; }
    .role-card:hover { background: var(--db-blue); color: var(--white); }
    .role-card.selected { background: var(--ink); color: var(--red); }
    .role-info { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--ink); color: var(--red); padding: 25px; font-size: 17px; line-height: 1.2; min-height: 100px; }
    
    .color-studio { display: flex; flex: 1 1 auto; width: 100%; min-width: 0; min-height: 0; }
    .color-options { display: flex; flex: 1 1 auto; min-width: 0; min-height: 0; gap: clamp(3px, .55vw, 8px); }
    .color-option { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(14px, 2vw, 30px); border-radius: 0; background: var(--option-color); color: var(--option-ink); text-align: left; transition: flex .65s cubic-bezier(.16, 1, .3, 1), box-shadow .3s, filter .3s; }
    .color-option-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
    .color-option-name { font-size: clamp(22px, 2.8vw, 42px); font-weight: 400; transition: font-size .45s cubic-bezier(.16, 1, .3, 1); }
    .color-option-value { font-size: clamp(18px, 2vw, 30px); font-weight: 400; }
    .color-option[aria-pressed="true"] { flex-grow: 3.2; box-shadow: inset 0 0 0 2px var(--option-ink); }
    .color-option[aria-pressed="true"] .color-option-name { font-size: clamp(38px, 7vw, 112px); }
    .color-option:hover:not([aria-pressed="true"]) { flex-grow: 1.2; }
    .color-option:focus-visible { outline: 3px solid var(--db-blue); outline-offset: -5px; }
    
    .logo-lab { height: clamp(340px, 40vw, 560px); position: relative; container-type: inline-size; background: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none; }
    .logo-lab * { user-select: none; -webkit-user-select: none; }
    .lab-layout { position: absolute; top: 50%; left: 50%; display: grid; width: 100%; aspect-ratio: 3558 / 799; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: min(var(--type-unit), .15vw); transform: translate(-50%, -50%); }
    .logo-lab .lab-letter { position: relative; display: grid; place-items: center; width: 100%; height: 100%; overflow: hidden; color: var(--red); transform-origin: center; transition: transform .9s cubic-bezier(.2,.8,.2,1); -webkit-user-drag: none; touch-action: none; cursor: grab; }
    .logo-lab .lab-letter svg { display: block; width: 100%; height: 100%; fill: currentColor; overflow: visible; }
    .logo-lab.is-floating .lab-letter { transition: none; will-change: transform; }
    .logo-lab.is-floating .lab-letter:active { cursor: grabbing; }
    .portal .logo-lab .lab-letter, .portal .logo-lab .lab-letter text { font-family: "Doltop", sans-serif !important; font-weight: 400; }

    async function animatePageContentExit() {
      const content = $('.portal-content');
      const profileSelector = active === 1 ? '.committee-person' : null;
      const profileContainer = active === 1 ? $('.committee-page') : null;
      const profiles = profileSelector ? [...content.querySelectorAll(profileSelector)] : [];
      const rows = [];

      profiles
        .map(element => ({ element, top: element.getBoundingClientRect().top }))
        .sort((a, b) => a.top - b.top)
        .forEach(item => {
          const row = rows[rows.length - 1];
          if (row && item.top - row.top < 4) row.elements.push(item.element);
          else rows.push({ top: item.top, elements: [item.element] });
        });
      rows.reverse();

      const elements = [...content.children]
        .filter(element => element !== profileContainer && element.getClientRects().length > 0);
      if (active === 1) elements.push($('.committee-page-heading'));
      elements.push($('.portal-header'));

      const exitDuration = 420;
      const elementDuration = exitDuration / elements.length;
      const animations = elements.map((element, index) => {
        const style = getComputedStyle(element);
        return element.animate(
          [
            { transform: style.transform, opacity: style.opacity, offset: 0 },
            { transform: `translate3d(0, ${Math.round(innerHeight * 0.35)}px, 0)`, opacity: style.opacity, offset: 0.55 },
            { transform: `translate3d(0, ${innerHeight + 80}px, 0)`, opacity: 0 }
          ],
          { duration: elementDuration, delay: index * elementDuration, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }
        );
      });

      const rowDuration = rows.length ? exitDuration / rows.length : 0;
      rows.forEach((row, rowIndex) => {
        row.elements.forEach(element => {
          const style = getComputedStyle(element);
          animations.push(element.animate(
            [
              { transform: style.transform, opacity: style.opacity },
              { transform: `translate3d(0, ${innerHeight + 80}px, 0)`, opacity: 0 }
            ],
            { duration: rowDuration, delay: rowIndex * rowDuration, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }
          ));
        });
      });

      await Promise.all(animations.map(animation => animation.finished));
      return animations;
    }

    async function animateSectionExit() {
      if (reduced || active < 0) return null;

      const guard = document.createElement('div');
      guard.className = 'chapter-transition-guard';
      document.body.append(guard);

      const pageAnimations = await animatePageContentExit();
      const veil = document.createElement('div');
      veil.className = 'chapter-transition-veil';
      const glyph = document.querySelector(`.glyph[data-section="${active}"]`);
      const glyphLetter = glyph?.querySelector('.glyph-letter');
      const glyphRect = glyphLetter?.getBoundingClientRect();
      const glyphStyle = glyphLetter && getComputedStyle(glyphLetter);
      const centerX = glyphRect ? glyphRect.left + glyphRect.width / 2 : innerWidth / 2;
      const centerY = glyphRect ? glyphRect.top + glyphRect.height / 2 : innerHeight / 2;
      const radius = Math.hypot(
        Math.max(centerX, innerWidth - centerX),
        Math.max(centerY, innerHeight - centerY)
      ) + 24;
      const translateX = centerX - innerWidth / 2;
      const translateY = centerY - innerHeight / 2;
      const scale = glyphRect?.width
        ? Math.max(innerWidth / glyphRect.width, innerHeight / glyphRect.height) * 1.35
        : 1;
      const word = glyphLetter && glyphStyle && document.createElement('span');

      if (word) {
        word.className = 'chapter-transition-word';
        word.innerHTML = glyphLetter.innerHTML;
        Object.assign(word.style, {
          left: `${glyphRect.left}px`,
          top: `${glyphRect.top}px`,
          width: `${glyphRect.width}px`,
          height: `${glyphRect.height}px`,
          fontFamily: glyphStyle.fontFamily,
          fontSize: glyphStyle.fontSize,
          fontWeight: glyphStyle.fontWeight,
          lineHeight: glyphStyle.lineHeight,
          letterSpacing: glyphStyle.letterSpacing,
          color: getComputedStyle(portal).color
        });
      }
      document.body.append(veil, ...(word ? [word] : []));
      await new Promise(requestAnimationFrame);

      let portalAnimation, wordAnimation;
      try {
        await Promise.all([
          veil.animate(
            [
              { clipPath: `circle(${radius}px at ${centerX}px ${centerY}px)` },
              { clipPath: `circle(0px at ${centerX}px ${centerY}px)` }
            ],
            { duration: 320, easing: 'cubic-bezier(.76, 0, .24, 1)', fill: 'forwards' }
          ).finished,
          word && (wordAnimation = word.animate(
            [
              { transform: `translate(${translateX}px, ${translateY}px) scale(${scale})`, color: getComputedStyle(portal).color },
              { transform: 'translate(0, 0) scale(1)', color: glyphStyle.color }
            ],
            { duration: 320, easing: 'cubic-bezier(.76, 0, .24, 1)', fill: 'forwards' }
          )).finished,
          (portalAnimation = portal.animate(
            [
              { transform: 'translateY(0) scale(1)', opacity: 1 },
              { transform: `translate(${translateX}px, ${translateY}px) scale(.04)`, opacity: 0 }
            ],
            { duration: 320, easing: 'cubic-bezier(.76, 0, .24, 1)', fill: 'forwards' }
          )).finished
        ]);
        return [...pageAnimations, portalAnimation];
      } finally {
        guard.remove();
        veil.remove();
        word?.remove();
      }
    }

    function closeSection(update = true) {
      if (chapterTransitioning || active < 0) return;
      chapterTransitioning = true;
      animateSectionExit().catch(() => null).then(animation => {
        finishCloseSection(update);
        animation?.forEach(item => item.cancel());
        chapterTransitioning = false;
      });
    }

    $$('[data-section]').forEach(b => b.onclick = event => {
      if (b.classList.contains('glyph') && touchGlyphTap === b) {
        touchGlyphTap = null;
        if (selectedTouchGlyph === b) {
          clearTimeout(touchGlyphDismissTimer);
          touchGlyphDismissTimer = null;
          selectedTouchGlyph = null;
          navigateSection(+b.dataset.section, b);

        }

        if (selectedTouchGlyph) {

          const previousIndex = glyphs.indexOf(selectedTouchGlyph);
          selectedTouchGlyph.classList.remove('is-active');

        }
        selectedTouchGlyph = b;
        b.classList.add('is-active');
        glyphs[glyphs.indexOf(b) - 6]?.classList.add('is-lifted');
        scheduleTouchGlyphDismiss();
        return;
      }

      navigateSection(+b.dataset.section, b);
    });
    $('#close-portal').onclick = () => closeSection();
    $('#close-zoom').onclick = closeZoom;

    async function navigateSection(index, source, update = true) {
      if (chapterTransitioning) return;
      chapterTransitioning = true;

      const sourceWord = source?.querySelector('.chapter-index-name, .glyph-letter');
      const sourceRect = sourceWord?.getBoundingClientRect();
      const sourceStyle = sourceWord && getComputedStyle(sourceWord);
      const guard = document.createElement('div');
      guard.className = 'chapter-transition-guard';
      const veil = document.createElement('div');
      veil.className = 'chapter-transition-veil';
      chapterIndex.close();
      if (active >= 0) {
        const exitAnimations = await animateSectionExit();
        finishCloseSection(false);
        exitAnimations?.forEach(animation => animation.cancel());
      }

      if (!reduced && sourceRect?.width && sourceStyle) {
        const word = document.createElement('span');
        const centerX = sourceRect.left + sourceRect.width / 2;
        const centerY = sourceRect.top + sourceRect.height / 2;
        const scale = Math.max(innerWidth / sourceRect.width, innerHeight / sourceRect.height) * 1.35;
        const radius = Math.hypot(Math.max(centerX, innerWidth - centerX), Math.max(centerY, innerHeight - centerY)) + 24;

        word.className = 'chapter-transition-word';
        word.innerHTML = sourceWord.matches('.glyph-letter') ? sourceWord.innerHTML : sourceWord.textContent;
        Object.assign(word.style, {
          left: `${sourceRect.left}px`,
          top: `${sourceRect.top}px`,
          width: `${sourceRect.width}px`,
          height: `${sourceRect.height}px`,
          fontFamily: sourceStyle.fontFamily,
          fontSize: sourceStyle.fontSize,
          fontWeight: sourceStyle.fontWeight,
          lineHeight: sourceStyle.lineHeight,
          letterSpacing: sourceStyle.letterSpacing,
          color: sourceStyle.color
        });
        document.body.append(guard, veil, word);

        try {
          await new Promise(requestAnimationFrame);
          await Promise.all([
            veil.animate(
              [
                { clipPath: `circle(0px at ${centerX}px ${centerY}px)` },
                { clipPath: `circle(${radius}px at ${centerX}px ${centerY}px)` }
              ],
              { duration: 560, easing: 'cubic-bezier(.76, 0, .24, 1)', fill: 'forwards' }
            ).finished,
            word.animate(
              [
                { transform: 'translate(0, 0) scale(1)', color: sourceStyle.color },
                {
                  transform: `translate(${innerWidth / 2 - centerX}px, ${innerHeight / 2 - centerY}px) scale(${scale})`,
                  color: getComputedStyle(portal).backgroundColor
                }
              ],
              { duration: 560, easing: 'cubic-bezier(.76, 0, .24, 1)', fill: 'forwards' }
            ).finished
          ]);
          openSection(index, update);
          await new Promise(resolve => setTimeout(resolve, 780));
          await Promise.all([
            veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out', fill: 'forwards' }).finished,
            word.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out', fill: 'forwards' }).finished
          ]);
        } finally {
          guard.remove();
          veil.remove();
          word.remove();
          chapterTransitioning = false;
        }
        return;
      }

      veil.remove();
      openSection(index, update);
      chapterTransitioning = false;
    }

    function legacyWire(i) {
      if (i === 0) {
        const lab = $('.logo-lab');
        const parts = $$('.lab-letter');
        const hasTouchInput = navigator.maxTouchPoints > 0
          || matchMedia('(pointer: coarse)').matches
          || matchMedia('(any-pointer: coarse)').matches;
        const reduceLogoMotion = reduced && !hasTouchInput;
        let motionFrame = 0;
        let previousTime = 0;
        let bodies = [];
        let assembleAnimations = [];
        let draggedBody = null;
        let activePointerId = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let lastPointerX = 0, lastPointerY = 0, lastPointerTime = 0;
        let pointerVelocityX = 0, pointerVelocityY = 0;
        let soloMode = false;
        let releaseOnClick = false;
        let didDrag = false;
        const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
        const getHalfExtents = body => {
          const radians = body.rotation * Math.PI / 180;
          const width = body.width * body.scale;
          const height = body.height * body.scale;
          return {
            x: (Math.abs(Math.cos(radians)) * width + Math.abs(Math.sin(radians)) * height) / 2,
            y: (Math.abs(Math.sin(radians)) * width + Math.abs(Math.cos(radians)) * height) / 2
          };
        };
        const keepInsideBox = body => {
          const half = getHalfExtents(body);
          const minX = Math.min(half.x, lab.clientWidth / 2);
          const maxX = Math.max(minX, lab.clientWidth - half.x);
          const minY = Math.min(half.y, lab.clientHeight / 2);
          const maxY = Math.max(minY, lab.clientHeight - half.y);
          if (body.x < minX) { body.x = minX; body.vx = Math.abs(body.vx) * .94; }
          if (body.x > maxX) { body.x = maxX; body.vx = -Math.abs(body.vx) * .94; }
          if (body.y < minY) { body.y = minY; body.vy = Math.abs(body.vy) * .94; }
          if (body.y > maxY) { body.y = maxY; body.vy = -Math.abs(body.vy) * .94; }
        };
        const drawBodies = () => bodies.forEach(body => {
          body.part.style.transform = `translate3d(${(body.x - body.homeX).toFixed(1)}px, ${(body.y - body.homeY).toFixed(1)}px, 0) rotate(${body.rotation.toFixed(1)}deg) scale(${body.scale.toFixed(3)})`;
        });
        const scatter = () => {
          assembleAnimations.forEach(animation => animation.cancel());
          assembleAnimations = [];
          const wasFloating = lab.classList.contains('is-floating') && bodies.length === parts.length;
          const previousBodies = bodies;
          if (motionFrame) cancelAnimationFrame(motionFrame);
          motionFrame = 0;
          soloMode = false;
          const labBounds = lab.getBoundingClientRect();
          const layoutBounds = lab.querySelector('.lab-layout').getBoundingClientRect();
          lab.classList.add('is-floating');
          bodies = parts.map((part, index) => {
            const width = part.offsetWidth;
            const height = part.offsetHeight;
            const homeLeft = layoutBounds.left - labBounds.left + part.offsetLeft;
            const homeTop = layoutBounds.top - labBounds.top + part.offsetTop;
            const previous = wasFloating ? previousBodies[index] : null;
            if (!previous) part.style.removeProperty('transform');
            part.style.zIndex = String(1 + Math.floor(Math.random() * 12));
            const homeX = homeLeft + width / 2;
            const homeY = homeTop + height / 2;
            const x = previous?.x ?? homeX;
            const y = previous?.y ?? homeY;
            const dx = x - lab.clientWidth / 2;
            const dy = y - lab.clientHeight / 2;
            const angle = Math.atan2(dy, dx) + (Math.random() - .5) * .8;
            const speed = reduceLogoMotion ? 0 : 260 + Math.random() * 220;
            const body = {
              part,
              width,
              height,
              homeX,
              homeY,
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              rotation: previous?.rotation ?? 0,
              angularVelocity: reduceLogoMotion ? 0 : (Math.random() - .5) * 100,
              scale: previous?.scale ?? 1,
              fixed: false
            };
            if (reduceLogoMotion) {
              const half = getHalfExtents(body);
              body.x = half.x + Math.random() * Math.max(0, lab.clientWidth - half.x * 2);
              body.y = half.y + Math.random() * Math.max(0, lab.clientHeight - half.y * 2);
            }
            return body;
          });
          drawBodies();
          if (reduceLogoMotion) return;

          const tick = timestamp => {
            if (!lab.isConnected || !lab.classList.contains('is-floating')) {
              motionFrame = 0;
              return;
            }
            const delta = previousTime ? Math.min((timestamp - previousTime) / 1000, .033) : 0;
            previousTime = timestamp;
            bodies.forEach(body => {
              if (body !== draggedBody && !body.fixed) {
                body.x += body.vx * delta;
                body.y += body.vy * delta;
                body.rotation += body.angularVelocity * delta;
              } else if (body === draggedBody) {
                body.vx = 0;
                body.vy = 0;
              }
              keepInsideBox(body);
            });

            for (let pass = 0; pass < 2; pass++) {
              for (let first = 0; first < bodies.length; first++) {
                for (let second = first + 1; second < bodies.length; second++) {
                  const a = bodies[first], b = bodies[second];
                  const halfA = getHalfExtents(a), halfB = getHalfExtents(b);
                  const dx = b.x - a.x, dy = b.y - a.y;
                  const overlapX = halfA.x + halfB.x - Math.abs(dx);
                  const overlapY = halfA.y + halfB.y - Math.abs(dy);
                  if (overlapX <= 0 || overlapY <= 0) continue;
                    a.fixed = false;
                    b.fixed = false;

                  const normalX = overlapX < overlapY ? (Math.sign(dx) || 1) : 0;
                  const normalY = overlapX < overlapY ? 0 : (Math.sign(dy) || 1);
                  const overlap = Math.min(overlapX, overlapY) + .5;
                  if (a === draggedBody) {
                    b.x += normalX * overlap;
                    b.y += normalY * overlap;
                  } else if (b === draggedBody) {
                    a.x -= normalX * overlap;
                    a.y -= normalY * overlap;
                  } else {
                    a.x -= normalX * overlap / 2;
                    a.y -= normalY * overlap / 2;
                    b.x += normalX * overlap / 2;
                    b.y += normalY * overlap / 2;
                  }

                  const relativeSpeed = (b.vx - a.vx) * normalX + (b.vy - a.vy) * normalY;
                  if (relativeSpeed < 0) {
                    if (a === draggedBody) {
                      b.vx -= (1 + .88) * relativeSpeed * normalX;
                      b.vy -= (1 + .88) * relativeSpeed * normalY;
                    } else if (b === draggedBody) {
                      a.vx += (1 + .88) * relativeSpeed * normalX;
                      a.vy += (1 + .88) * relativeSpeed * normalY;
                    } else {
                      const impulse = -(1 + .88) * relativeSpeed / 2;
                      a.vx -= impulse * normalX;
                      a.vy -= impulse * normalY;
                      b.vx += impulse * normalX;
                      b.vy += impulse * normalY;
                    }
                    a.angularVelocity += (Math.random() - .5) * 18;
                    b.angularVelocity += (Math.random() - .5) * 18;
                  }
                  keepInsideBox(a);
                  keepInsideBox(b);
                }
              }
            }
            drawBodies();
            motionFrame = requestAnimationFrame(tick);
          };
          previousTime = 0;
          motionFrame = requestAnimationFrame(tick);
        };
        const onPointerDown = event => {
          const part = event.target.closest('.lab-letter');
          if (!part) return;
          if (!lab.classList.contains('is-floating')) {
            scatter();
            soloMode = true;
            bodies.forEach(body => {
              body.x = body.homeX;
              body.y = body.homeY;
              body.vx = 0;
              body.vy = 0;
              body.rotation = 0;
              body.angularVelocity = 0;
              body.scale = 1;
              body.fixed = true;
              body.part.style.zIndex = '1';
            });
          }
          const body = bodies.find(candidate => candidate.part === part);
          if (!body) return;
          releaseOnClick = soloMode;
          didDrag = false;
          if (soloMode) {
            bodies.forEach(candidate => {
              if (candidate !== body) {
                candidate.fixed = true;
                candidate.vx = 0;
                candidate.vy = 0;
                candidate.angularVelocity = 0;
              }
            });
            body.fixed = false;
            body.rotation = Math.random() * 50 - 25;
            body.angularVelocity = 0;
            body.scale = .82 + Math.random() * .16;
          }
          if (!motionFrame && !reduceLogoMotion) {
            previousTime = 0;
          }
          if (!lab.classList.contains('is-floating')) {
            lab.classList.add('is-floating');
          }
          if (soloMode) {
            drawBodies();
          }
          event.preventDefault();
          draggedBody = body;
          activePointerId = event.pointerId;
          const bounds = lab.getBoundingClientRect();
          dragOffsetX = body.x - (event.clientX - bounds.left);
          dragOffsetY = body.y - (event.clientY - bounds.top);
          lastPointerX = body.x;
          lastPointerY = body.y;
          lastPointerTime = performance.now();
          pointerVelocityX = 0;
          pointerVelocityY = 0;
          body.part.style.zIndex = '20';
          lab.setPointerCapture(event.pointerId);
        };
        const onPointerMove = event => {
          if (!draggedBody || event.pointerId !== activePointerId) return;
          const bounds = lab.getBoundingClientRect();
          const targetX = event.clientX - bounds.left + dragOffsetX;
          const targetY = event.clientY - bounds.top + dragOffsetY;
          if (Math.hypot(targetX - draggedBody.x, targetY - draggedBody.y) > 3) didDrag = true;
          const now = performance.now();
          const elapsed = Math.max((now - lastPointerTime) / 1000, .001);
          pointerVelocityX = clamp((targetX - lastPointerX) / elapsed, -720, 720);
          pointerVelocityY = clamp((targetY - lastPointerY) / elapsed, -720, 720);
          lastPointerX = targetX;
          lastPointerY = targetY;
          lastPointerTime = now;
          draggedBody.x = targetX;
          draggedBody.y = targetY;
          keepInsideBox(draggedBody);
          drawBodies();
        };
        const onPointerUp = event => {
          if (!draggedBody || event.pointerId !== activePointerId) return;
          const body = draggedBody;
          if (releaseOnClick && !didDrag && reduceLogoMotion) {
            const half = getHalfExtents(body);
            body.x = half.x + Math.random() * Math.max(0, lab.clientWidth - half.x * 2);
            body.y = half.y + Math.random() * Math.max(0, lab.clientHeight - half.y * 2);
          }
          body.vx = reduceLogoMotion ? 0 : (releaseOnClick && !didDrag ? (Math.random() < .5 ? -1 : 1) * (130 + Math.random() * 150) : pointerVelocityX * .82);
          body.vy = reduceLogoMotion ? 0 : (releaseOnClick && !didDrag ? (Math.random() < .5 ? -1 : 1) * (110 + Math.random() * 130) : pointerVelocityY * .82);

          stage.addEventListener('pointermove', event => {

            stage.style.setProperty('--film-x', `${(event.clientX-bounds.left-bounds.width/2)*.018}px`);
            stage.style.setProperty('--film-y', `${(event.clientY-bounds.top-bounds.height/2)*.018}px`);
          }, {signal:controller.signal});

            stage.style.setProperty('--film-x', '0px'); stage.style.setProperty('--film-y', '0px');

          const deltaX = event.clientX - touchStart.x;

            lens.style.left = `${event.clientX}px`;
            lens.style.top = `${event.clientY}px`;
            lens.classList.add('visible');
          };
          button.addEventListener('pointerenter', updateLens);
          button.addEventListener('pointermove', updateLens);
          button.addEventListener('pointerleave', () => lens.classList.remove('visible'));

            const dataMedia = poster.video
              ? `data-poster-video="${videoPath}"`

            const media = poster.video

            return `<button class="archive-card archive-card-${position}${poster.fronts ? ' archive-card-pair' : ''}" data-archive-offset="${offset}" data-poster="${posterPath}" data-poster-year="${year}" ${dataMedia} aria-label="${year}년 포스터${offset === 0 ? ' 확대' : ''}" type="button">

        const moveArchive = direction => {

          });
          venueFlip.loadFromHTML(venueBook.querySelectorAll('.page'));
          updateVenueBookControls(0);
          loadBookSpread(venuePageImages, 0);
        };

        venueButtons.forEach(button => button.addEventListener('click', () => selectVenueStudent(Number(button.dataset.venueStudent))));
        searchInput.addEventListener('input', () => {
          const query = searchInput.value.trim().toLocaleLowerCase('ko');
          let matchCount = 0;
          venueButtons.forEach(button => {
            const index = Number(button.dataset.venueStudent);
            const matches = studentRecords[index].name.toLocaleLowerCase('ko').includes(query);
            if (button.classList.contains('venue-student')) button.hidden = !matches;
            if (button.classList.contains('venue-booth')) button.classList.toggle('filtered-out', !matches);
            if (matches && button.classList.contains('venue-student')) {
              matchCount++;
            }
          });
          $('#venue-match-count').textContent = matchCount;
          $('#venue-empty').hidden = matchCount > 0;
          if (selectedIndex >= 0 && (!matchCount || !studentRecords[selectedIndex].name.toLocaleLowerCase('ko').includes(query))) {
            clearVenueSelection();
          }
        });
      }

      if (i === 11) window.initAccumulationWordle();
      
      scheduleLayerReveal();
    }

    const initial = sectionFromHash();
    if (initial >= 0) openSection(initial, false);
  </script>
</body>
</html>
